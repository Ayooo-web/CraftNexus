[package]
name = "craft-nexus-contract"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "craft_nexus_contract"

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "21.7.7" }
wee_alloc = "0.4.5"
# Pin dalek 2.x: ed25519-dalek 3.x breaks soroban-env-host 21.2.1 testutils (CryptoRng bound).
ed25519-dalek = "=2.2.0"

[dev-dependencies]
soroban-sdk = { version = "21.7.7", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
